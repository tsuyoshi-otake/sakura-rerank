[project]
name = "issue21-train-env"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = [
  "torch==2.12.1+cu130",
  "numpy==2.3.5",
  "onnx==1.19.1",
  "onnxruntime==1.23.2",
]

[tool.uv]
package = false
exclude-newer = "2026-10-31T00:00:00Z"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
